# Per-push checks for the Terraform module.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: fmt · validate
    if: vars.OSS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: Validate the root module and every submodule
        run: |
          set -euo pipefail
          for dir in . $(find modules examples -name '*.tf' -printf '%h\n' 2>/dev/null | sort -u); do
            echo "::group::validate ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
